<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記 仕訳トレーニング</title>
<style>
:root{--bg:#F4F1EA;--card:#FFFDF8;--ink:#1F2A30;--sub:#55636B;--line:#C9C3B6;--ac:#0B5A7A;--acink:#fff;--ok:#00664A;--ng:#A82A1E;--mark:#F7E7A6}
@media (prefers-color-scheme:dark){:root{--bg:#12191D;--card:#1C262B;--ink:#EDF1F3;--sub:#AEBBC2;--line:#3A4A52;--ac:#7CC4E0;--acink:#0B1A20;--ok:#66D3AE;--ng:#FF9F94;--mark:#57491A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 16px 48px}h1{font-size:23px;margin:8px 0}h2{font-size:19px;margin:0 0 6px;line-height:1.4}p{margin:6px 0}
button,select,input{font:inherit;color:inherit}button{min-height:48px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
button.pri{background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:700}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.sub{color:var(--sub);font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1 1 140px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--ac)}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:6px 0}.mini{background:var(--mark);border-radius:8px;padding:8px 12px}
.ent{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side{min-width:0}.side b{display:block;font-size:14px;color:var(--sub)}.side select,.side input{width:100%;min-height:44px;margin:3px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:4px 6px}
.line{padding:8px 0;border-top:1px dashed var(--line)}.line:first-child{border-top:0}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:left}td.n{text-align:right;white-space:nowrap}h3{font-size:16px;margin:10px 0 2px}ol{margin:4px 0;padding-left:1.4em}td,th,dd,p{overflow-wrap:anywhere}.tw{overflow-x:auto}
.v{font-weight:700;font-size:20px}.v.ok{color:var(--ok)}.v.ng{color:var(--ng)}dl{margin:0}dt{font-weight:700;font-size:14px;color:var(--sub);margin-top:8px}dd{margin:0}
.ws{border-collapse:collapse;font-size:14px;background:var(--card)}.ws th,.ws td{white-space:nowrap;padding:2px 4px}.ws th:first-child,.ws td:first-child{position:sticky;left:0;background:var(--card);z-index:1}.ws input{width:88px;min-height:40px;text-align:right;border:1.5px solid var(--line);border-radius:6px;background:var(--card);padding:2px 4px}.ws input.bad{border:3px solid var(--ng)}.ws td.tot{font-weight:700;text-align:right}
.fig{margin:10px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}.ft{font-weight:700;font-size:15px;margin-top:6px}.bar{display:flex;height:22px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}.bar i{display:block;background:var(--card);border-right:1.5px solid var(--ink)}.bar i:last-child{border-right:0}.bar i.hl{background:repeating-linear-gradient(45deg,var(--ac),var(--ac) 4px,var(--mark) 4px,var(--mark) 8px)}.lg{list-style:none;margin:4px 0;padding:0;font-size:15px}.fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}.nd{border:1.5px solid var(--ink);border-radius:6px;padding:4px 8px;font-size:15px}.ar{font-weight:700}
@media (max-width:420px){.side select,.side input{font-size:15px}main{padding:10px 12px 40px}.card{padding:12px}}
</style></head><body><main id="app"></main><script>
